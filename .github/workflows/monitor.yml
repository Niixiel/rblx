name: Roblox AFK Monitor

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

# Diperlukan agar workflow bisa commit + push data/status.json ke branch utama.
permissions:
  contents: write

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # persist-credentials default true => git push memakai GITHUB_TOKEN otomatis.
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run Roblox AFK monitor
        env:
          ROBLOX_USER_IDS: ${{ secrets.ROBLOX_USER_IDS }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python monitor.py

      - name: Commit and push status.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/status.json
          # Hanya commit bila ada perubahan; git push memakai token dari checkout.
          git diff --cached --quiet || (git commit -m "chore: update status.json [skip ci]" && git push)